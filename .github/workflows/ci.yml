name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12", "3.13", "3.14"]
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4

    - name: Create or update Conda environment
      run: |
        conda create -y -n py${{ matrix.python-version }} python=${{ matrix.python-version }} || conda install -y -n py${{ matrix.python-version }} python=${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        # Install CPU version of JAX for CI
        conda run -n py${{ matrix.python-version }} python -m pip install -U "jax[cpu]"
        # Install other dependencies
        conda run -n py${{ matrix.python-version }} python -m pip install numpy scipy optax flax pyscf folx
        # Install the package itself
        conda run -n py${{ matrix.python-version }} python -m pip install -e .

    - name: Run tests
      run: |
        # Use explicit directory discovery to avoid requiring __init__.py files in tests
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/test -t pytc/test
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/autodiff/jastrow/test -t pytc/autodiff/jastrow/test
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/autodiff/test -t pytc/autodiff/test
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/utils/test -t pytc/utils/test
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/jastrow/test -t pytc/jastrow/test
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/vmc/test -t pytc/vmc/test
        conda run -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/ansatz/test -t pytc/ansatz/test
