name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Full test suite on boundary Python versions (oldest + newest supported)
  full-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.14"]  # 3.10 minimum (folx requires >=3.10)

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package with dependencies
      run: python -m pip install -e .

    - name: Run full tests
      run: |
        python -m unittest discover -v -s pytc/test -t pytc/test
        python -m unittest discover -v -s pytc/jastrow/test -t pytc/jastrow/test
        # The vmc dir contains modules that need XLA_FLAGS set BEFORE jax import
        # (test_multi_gpu, test_multi_gpu_batched, test_shard_map). When discover
        # walks the dir it imports other modules first and jax initialises with
        # 1 device, so those tests skip via @skipUnless. Re-run them in a fresh
        # process with the flag in the environment so they actually exercise
        # the multi-device path.
        python -m unittest discover -v -s pytc/vmc/test -t pytc/vmc/test
        XLA_FLAGS=--xla_force_host_platform_device_count=4 \
            python -m unittest -v \
              pytc.vmc.test.test_multi_gpu \
              pytc.vmc.test.test_multi_gpu_batched \
              pytc.vmc.test.test_shard_map
        python -m unittest discover -v -s pytc/ansatz/test -t pytc/ansatz/test
        python -m unittest discover -v -s pytc/solver/test -t pytc/solver/test
        python -m unittest discover -v -s pytc/legacy/test -t pytc/legacy/test

  # Smoke tests on intermediate Python versions (quick import + basic tests)
  smoke-test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        cache: 'pip'

    - name: Install package with dependencies
      run: python -m pip install -e .

    - name: Run smoke tests
      run: |
        python -c "import pytc; print('pytc version:', getattr(pytc, '__version__', 'unknown'))"
        python -c "from pytc.vmc import optimize, sample"
        python -c "from pytc.jastrow import REXP, Poly, NuclearCusp, BoysHandy"
        python -c "from pytc.ansatz.sj import SlaterJastrow"
