name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.9", "3.14"]

    steps:
    - uses: actions/checkout@v4

    - name: Set up Python ${{ matrix.python-version }}
      run: |
        echo "Using system Python ${{ matrix.python-version }}"
        python${{ matrix.python-version }} --version
        python${{ matrix.python-version }} -m venv venv
        source venv/bin/activate
        python -m pip install --upgrade pip
    
    - name: Install dependencies
      run: |
        source venv/bin/activate
        # Install CPU version of JAX for CI
        python -m pip install -U "jax[cpu]"
        # Install other dependencies
        python -m pip install numpy scipy optax kfac_jax flax pyscf
        # Install folx only for Python >= 3.10
        if [[ "${{ matrix.python-version }}" == "3.9" ]]; then
          echo "Skipping folx for Python 3.9 (requires >=3.10)"
        else
          python -m pip install folx
        fi
        # Install the package itself if needed, or just dependencies
        # Assuming dev install or just running tests against source
        python -m pip install -e .

    - name: Run tests
      run: |
        source venv/bin/activate
        # Use explicit directory discovery to avoid requiring __init__.py files in tests
        # Note: VMC-related tests (ansatz, vmc) are skipped in CI - run locally for VMC development
        python -m unittest discover -v -s pytc/test -t pytc/test
        python -m unittest discover -v -s pytc/autodiff/jastrow/test -t pytc/autodiff/jastrow/test
        python -m unittest discover -v -s pytc/autodiff/test -t pytc/autodiff/test
        python -m unittest discover -v -s pytc/utils/test -t pytc/utils/test
        python -m unittest discover -v -s pytc/jastrow/test -t pytc/jastrow/test
