name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # Full test suite on boundary Python versions (oldest + newest supported)
  full-test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.10", "3.14"]  # 3.10 minimum (folx requires >=3.10)
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4

    - name: Create or update Conda environment
      run: |
        conda create -y -n py${{ matrix.python-version }} --override-channels -c conda-forge python=${{ matrix.python-version }} || conda install -y -n py${{ matrix.python-version }} --override-channels -c conda-forge python=${{ matrix.python-version }}

    - name: Install package with dependencies
      run: |
        # Install the package and all dependencies from pyproject.toml
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m pip install -e .

    - name: Run full tests
      run: |
        # Use explicit directory discovery to avoid requiring __init__.py files in tests
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/test -t pytc/test
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/autodiff/jastrow/test -t pytc/autodiff/jastrow/test
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/autodiff/test -t pytc/autodiff/test
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/autodiff/vmc/test -t pytc/autodiff/vmc/test
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/autodiff/ansatz/test -t pytc/autodiff/ansatz/test
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/utils/test -t pytc/utils/test
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/solver/test -t pytc/solver/test
        #conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/jastrow/test -t pytc/jastrow/test

    - name: Cleanup workspace
      if: always()
      run: |
        echo "Cleaning up workspace..."
        find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +

  # Smoke tests on intermediate Python versions (quick import + basic tests)
  smoke-test:
    runs-on: self-hosted
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    defaults:
      run:
        shell: bash -l {0}

    steps:
    - uses: actions/checkout@v4

    - name: Create or update Conda environment
      run: |
        conda create -y -n py${{ matrix.python-version }} --override-channels -c conda-forge python=${{ matrix.python-version }} || conda install -y -n py${{ matrix.python-version }} --override-channels -c conda-forge python=${{ matrix.python-version }}

    - name: Install package with dependencies
      run: |
        # Install the package and all dependencies from pyproject.toml
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m pip install -e .

    - name: Run smoke tests
      run: |
        # Quick import checks to verify the package works
        conda run --no-capture-output -n py${{ matrix.python-version }} python -c "import pytc; print('pytc version:', getattr(pytc, '__version__', 'unknown'))"
        conda run --no-capture-output -n py${{ matrix.python-version }} python -c "from pytc.autodiff.vmc import optimize, sample"
        conda run --no-capture-output -n py${{ matrix.python-version }} python -c "from pytc.autodiff.jastrow import REXP, Poly, NuclearCusp, BoysHandy"
        conda run --no-capture-output -n py${{ matrix.python-version }} python -c "from pytc.autodiff.ansatz.sj import SlaterJastrow"
        # Run a subset of quick tests
        conda run --no-capture-output -n py${{ matrix.python-version }} python -m unittest discover -v -s pytc/utils/test -t pytc/utils/test

    - name: Cleanup workspace
      if: always()
      run: |
        echo "Cleaning up workspace..."
        find . -maxdepth 1 ! -name '.' ! -name '.git' -exec rm -rf {} +
