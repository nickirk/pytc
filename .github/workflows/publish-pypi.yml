name: Publish to PyPI

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # required for OIDC Trusted Publishing
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Build sdist and wheel
        run: |
          pip install build
          python -m build

      # Publishes dist/ via OIDC Trusted Publishing — no API token needed.
      # NB: this is a Docker action; its images are tagged by version, not by git
      # commit SHA, so git-SHA pinning breaks image resolution. pypa maintains
      # `release/v1` as the security-reviewed stable ref — use it, not a commit SHA.
      - uses: pypa/gh-action-pypi-publish@release/v1
