name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        # Pin jax/jaxlib and other deps to ensure compatibility
        pip install jax==0.4.30 jaxlib==0.4.30 chex==0.1.85 optax==0.1.9 psutil scipy==1.13.1 flax kfac-jax folx tqdm pyscf
        
        # Patch kfac-jax to fix register_dataclass error
        SITE_PACKAGES=$(python -c "import site; print(site.getsitepackages()[0])")
        TRACER_FILE="$SITE_PACKAGES/kfac_jax/_src/tracer.py"
        sed -i 's/import jax/import chex\nimport jax/' "$TRACER_FILE"
        sed -i 's/@jax.tree_util.register_dataclass/@chex.dataclass(frozen=True)/' "$TRACER_FILE"
        sed -i '/@dataclasses.dataclass(frozen=True)/d' "$TRACER_FILE"
        
    - name: Install pytc
      run: |
        pip install -e .
        
    - name: Run tests
      run: |
        python -m unittest discover -v
