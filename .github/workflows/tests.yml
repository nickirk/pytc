name: Tests

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10"]

    steps:
    - uses: actions/checkout@v4
    
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
        
    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install jax jaxlib==0.4.30 scipy==1.13.1 flax optax kfac-jax folx tqdm pyscf pytest pytest-anyio
        
    - name: Install pytc
      run: |
        pip install -e .
        
    - name: Run tests
      run: |
        pytest
