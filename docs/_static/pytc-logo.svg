<svg xmlns="http://www.w3.org/2000/svg" viewBox="-6 -6 380 148" role="img" aria-label="PyTC logo">
  <title>PyTC</title>
  <defs>
    <!-- JAX-flavoured purple->orange gradient, applied across the full
         letterforms via userSpaceOnUse so individual blocks pick up the
         appropriate slice of the spectrum. -->
    <linearGradient id="pytcGrad" x1="0" y1="0" x2="368" y2="136"
                    gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6c5ce7"/>
      <stop offset="55%" stop-color="#c5547f"/>
      <stop offset="100%" stop-color="#ff9f43"/>
    </linearGradient>
    <!-- Subtle top highlight on each block for a hint of depth. -->
    <linearGradient id="pytcShine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <rect id="pytcBlock" width="24" height="24" rx="4"/>

    <g id="pytcLetters">
      <!-- P -->
      <use href="#pytcBlock" x="0" y="0"/>
      <use href="#pytcBlock" x="28" y="0"/>
      <use href="#pytcBlock" x="56" y="0"/>
      <use href="#pytcBlock" x="0" y="28"/>
      <use href="#pytcBlock" x="56" y="28"/>
      <use href="#pytcBlock" x="0" y="56"/>
      <use href="#pytcBlock" x="28" y="56"/>
      <use href="#pytcBlock" x="56" y="56"/>
      <use href="#pytcBlock" x="0" y="84"/>
      <use href="#pytcBlock" x="0" y="112"/>

      <!-- Y -->
      <use href="#pytcBlock" x="96" y="0"/>
      <use href="#pytcBlock" x="152" y="0"/>
      <use href="#pytcBlock" x="96" y="28"/>
      <use href="#pytcBlock" x="152" y="28"/>
      <use href="#pytcBlock" x="124" y="56"/>
      <use href="#pytcBlock" x="124" y="84"/>
      <use href="#pytcBlock" x="124" y="112"/>

      <!-- T -->
      <use href="#pytcBlock" x="192" y="0"/>
      <use href="#pytcBlock" x="220" y="0"/>
      <use href="#pytcBlock" x="248" y="0"/>
      <use href="#pytcBlock" x="220" y="28"/>
      <use href="#pytcBlock" x="220" y="56"/>
      <use href="#pytcBlock" x="220" y="84"/>
      <use href="#pytcBlock" x="220" y="112"/>

      <!-- C -->
      <use href="#pytcBlock" x="288" y="0"/>
      <use href="#pytcBlock" x="316" y="0"/>
      <use href="#pytcBlock" x="344" y="0"/>
      <use href="#pytcBlock" x="288" y="28"/>
      <use href="#pytcBlock" x="288" y="56"/>
      <use href="#pytcBlock" x="288" y="84"/>
      <use href="#pytcBlock" x="288" y="112"/>
      <use href="#pytcBlock" x="316" y="112"/>
      <use href="#pytcBlock" x="344" y="112"/>
    </g>

    <mask id="pytcLetterMask" x="0" y="0" width="368" height="136" maskUnits="userSpaceOnUse">
      <use href="#pytcLetters" fill="#ffffff"/>
    </mask>
  </defs>

  <rect x="0" y="0" width="368" height="136" fill="url(#pytcGrad)" mask="url(#pytcLetterMask)"/>
  <use href="#pytcLetters" fill="url(#pytcShine)" pointer-events="none"/>
</svg>
