[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "pytc"
version = "0.1.0"
description = "Python TransCorrelation package"
authors = [
    {name = "Ke Liao", email = "ke.liao.whu@gmail.com"}
]
keywords = [
    "quantum-chemistry", 
    "transcorrelation", 
    "jastrow-factors", 
    "monte-carlo", 
    "computational-chemistry"
]
requires-python = ">=3.10"
dependencies = [
    "numpy",
    "scipy",
    "jax",
    "optax",
    "flax",
    "folx @ git+https://github.com/microsoft/folx.git@67e7e8a",

    "pyscf",
]

classifiers = [
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Physics",
    "Topic :: Scientific/Engineering :: Chemistry",
    "Programming Language :: Python :: 3.10",
]

[project.optional-dependencies]
gpu = [
    "jaxlib[cuda]",
]
docs = [
    "sphinx>=7.0",
    "furo",
    "myst-parser",
    "sphinx-copybutton",
    "sphinx-autodoc-typehints",
]

[project.urls]
Homepage = "https://github.com/nickirk/pytc"

[tool.setuptools.packages.find]
where = ["."]
include = ["pytc*"]
exclude = ["logs*", "*.tests", "*.tests.*", "tests.*", "tests"]

[tool.setuptools.package-data]
pytc = ["py.typed"]