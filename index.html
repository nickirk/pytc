<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>PyTC documentation has moved</title>
  <link rel="canonical" href="https://nickirk.github.io/pytc-docs/">
  <meta name="robots" content="noindex">
  <meta http-equiv="refresh" content="0; url=https://nickirk.github.io/pytc-docs/">
  <script>
    // Redirect the old docs root to the new site, preserving any query
    // string and fragment. Runs before the meta-refresh fallback fires.
    (function () {
      window.location.replace(
        "https://nickirk.github.io/pytc-docs/" +
        window.location.search + window.location.hash
      );
    })();
  </script>
</head>
<body>
  <p>The PyTC documentation has moved to
     <a href="https://nickirk.github.io/pytc-docs/">https://nickirk.github.io/pytc-docs/</a>.
     Redirecting&hellip;</p>
</body>
</html>
